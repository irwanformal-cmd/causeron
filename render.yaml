services:
  - type: web
    name: causeron
    runtime: python
    repo: https://github.com/irwanformal-cmd/riak
    branch: main
    buildCommand: "echo 'zero deps'"
    startCommand: "CAUSERON_PORT=${PORT:-8000} python3 server.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    autoDeploy: true
